services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 15432 en el host: 5432 lo ocupa otro proyecto del usuario. Adentro del
      # contenedor sigue siendo 5432, asi que el servicio migrate no cambia.
      # Bindeado solo a loopback: Postgres usa credenciales de desarrollo
      # (ludex/ludex) y no debe quedar alcanzable desde el resto de la red.
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/amacneil/dbmate:2.21
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_SCHEMA_FILE: /db/schema.sql
      DBMATE_NO_DUMP_SCHEMA: "false"
    volumes:
      - ./db:/db

  showdown:
    profiles: ["local"]
    build: ./docker/showdown
    ports:
      # El server corre con --no-security: bindeado solo a loopback, nunca a
      # toda la red local.
      - "127.0.0.1:${SHOWDOWN_LOCAL_PORT}:8000"

  calc:
    build:
      context: .
      dockerfile: packages/calc/Dockerfile
    environment:
      # Adentro del contenedor necesita 0.0.0.0; la exposicion al host queda
      # restringida abajo. Funcion pura sin autenticacion: misma regla que
      # Postgres (D11), nunca publicado en toda la red.
      HOST: 0.0.0.0
      PORT: 8200
    ports:
      - "127.0.0.1:${CALC_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
