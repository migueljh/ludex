[project]
name = "ludex-agent"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "poke-env==0.15.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "typer==0.15.1",
]

[dependency-groups]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ludex_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
